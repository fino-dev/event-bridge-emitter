# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:

    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set plugin version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          node-version: '22'
          go-version: '1.26.6'
          attestation: true
          use_changelog_generator: true # Enable automatic changelog generation
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
