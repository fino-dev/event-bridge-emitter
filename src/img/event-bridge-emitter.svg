<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Event Bridge Emitter</title>
  <desc id="desc">A glowing orange event emitter symbol surrounded by an open circular arrow.</desc>

  <defs>
    <linearGradient id="ring-gradient" x1="150" y1="430" x2="410" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3512" />
      <stop offset="0.38" stop-color="#ff4f0b" />
      <stop offset="0.72" stop-color="#ff7905" />
      <stop offset="1" stop-color="#ffab08" />
    </linearGradient>

    <linearGradient id="emitter-gradient" x1="181" y1="256" x2="432" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffab08" />
      <stop offset="0.55" stop-color="#ff8b00" />
      <stop offset="1" stop-color="#ff5b09" />
    </linearGradient>

    <filter id="ring-glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="wide-glow" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="soft-glow" />
      <feMerge>
        <feMergeNode in="wide-glow" />
        <feMergeNode in="soft-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="emitter-glow" x="-30%" y="-45%" width="160%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="wide-glow" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="soft-glow" />
      <feMerge>
        <feMergeNode in="wide-glow" />
        <feMergeNode in="soft-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Open circular arrow / event flow -->
  <path
    d="M 412 191 A 170 170 0 1 0 412 321"
    fill="none"
    stroke="url(#ring-gradient)"
    stroke-width="52"
    stroke-linecap="butt"
    filter="url(#ring-glow)"
  />

  <!-- Emitter body -->
  <g filter="url(#emitter-glow)">
    <path
      d="M 256 174 L 328 216 L 328 296 L 256 338 L 184 296 L 184 216 Z"
      fill="url(#emitter-gradient)"
    />

    <!-- Outgoing event arrow -->
    <path
      d="M 252 239 H 376 L 368 211 L 438 256 L 368 301 L 376 273 H 252 Z"
      fill="#fff"
    />
  </g>
</svg>
