apiVersion: 1

apps:
  - type: 'toshilab-eventbridgeemitter-app'
    org_id: 1
    org_name: 'toshi-lab'
    disabled: false
    jsonData:
      authType: default
      defaultRegion: ap-northeast-1
      templates:
        - id: deploy-start
          name: Start deployment
          description: Send a deployment-start event with operator-provided values.
          tags:
            - deployment
          target:
            region: ap-northeast-1
            eventBusName: default
          event:
            source: toshi-lab.deployments
            detailType: DeploymentStarted
            fixedDetail:
              application: eventbridge-emitter
            fields:
              - key: deploymentId
                label: Deployment ID
                type: string
                required: true
              - key: environment
                label: Environment
                type: select
                required: true
                default: development
                options:
                  - development
                  - staging
                  - production
