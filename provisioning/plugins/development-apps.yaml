apiVersion: 1

apps:
  - type: 'fino-eventbridgeemitter-app'
    org_id: 1
    org_name: 'toshi-lab'
    disabled: false
    jsonData:
      authType: default
      defaultRegion: ap-northeast-1
      templates:
        - id: test-event
          name: Test Event
          description: Test Event
          tags:
            - test
          target:
            region: ap-northeast-1
            eventBusName: fino-eventbridgeemitter-app-dev-bus
          event:
            source: fino.eventbridgeemitter.app
            detailType: TestEvent
            fixedDetail: {}
            fields:
              - key: message
                label: Message
                type: string
                required: true
                default: Hello, world!
