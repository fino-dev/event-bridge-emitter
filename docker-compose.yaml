services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    volumes:
      - ~/.aws:/root/.aws:ro
    environment:
      GF_AWS_FORWARD_SETTINGS_TO_PLUGINS: fno-eventbridgeemitter-app
      GF_LOG_FILTERS: plugin.fno-eventbridgeemitter-app:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: fno-eventbridgeemitter-app
